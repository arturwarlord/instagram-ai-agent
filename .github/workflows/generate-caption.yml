name: Generate Alicia Caption

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Exact PNG filename already in content/selected/ (filename only)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  caption:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate caption draft
        env:
          SELECTED_FILENAME: ${{ inputs.filename }}
          Workers_AI: ${{ secrets.Workers_AI }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/generate_caption.py "$SELECTED_FILENAME"
      - name: Commit caption draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/captions/
          git commit -m "content: add Alicia caption draft"
          git push
