name: Prepare Alicia Post Queue Entry

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Exact PNG filename in content/selected/"
        required: true
        type: string
      scheduled_at_utc:
        description: "Future UTC timestamp, for example 2026-10-20T15:00:00Z"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prepare unpublished queue entry
        env:
          SELECTED_FILENAME: \${{ inputs.filename }}
          SCHEDULED_AT_UTC: \${{ inputs.scheduled_at_utc }}
        run: python scripts/prepare_post.py "$SELECTED_FILENAME" "$SCHEDULED_AT_UTC"
      - name: Commit queue entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/queue/
          git commit -m "content: queue Alicia post draft"
          git push
