name: Sync Alicia Queue to Metricool

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only; do not send anything to Metricool"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: metricool-queue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test Metricool queue integration
        run: python -m unittest tests.test_sync_metricool_queue -v
      - name: Submit enabled queue entries to Metricool
        env:
          METRICOOL_API_TOKEN: ${{ secrets.METRICOOL_API_TOKEN }}
          METRICOOL_USER_ID: ${{ secrets.METRICOOL_USER_ID }}
          METRICOOL_BLOG_ID: ${{ secrets.METRICOOL_BLOG_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: python scripts/sync_metricool_queue.py
      - name: Save submitted queue statuses
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/queue/
          if git diff --cached --quiet; then
            echo "No queue state changes to commit."
          else
            git commit -m "automation: sync Alicia queue to Metricool [skip ci]"
            git push
          fi
