name: Instagram AI Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
        run: python main.py

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: alicia-generated-image
          path: |
            content/generated/alicia_test.jpg
            content/posts/alicia_test.json
          if-no-files-found: error

      - name: Save generation history
        run: |
          if git diff --quiet -- data/generation_history.json data/caption_history.json content/posts/alicia_test.json; then
            echo "ℹ️ No history changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/generation_history.json data/caption_history.json content/posts/alicia_test.json
          git commit -m "chore: save generated post [skip ci]"
          git push
