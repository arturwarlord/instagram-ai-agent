name: Instagram AI Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent
        env:
          Workers_AI: ${{ secrets.Workers_AI }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python main.py

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: alicia-generated-image
          path: |
            content/generated/alicia_test.png
          if-no-files-found: error

      - name: Save generation history
        run: |
          if git diff --quiet -- data/generation_history.json; then
            echo "ℹ️ No history changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/generation_history.json content/generated/alicia_test.png
          git commit -m "chore: save generated post [skip ci]"
          git push

