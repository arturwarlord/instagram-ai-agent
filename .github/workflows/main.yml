name: Instagram AI Agent

on:
  workflow_dispatch:
  schedule:
    # Generate one new photo every day at 15:00 UTC.
    - cron: "0 15 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Record existing images
        run: |
          mkdir -p "$RUNNER_TEMP"
          find content/generated -maxdepth 1 -type f -name '*.png' -printf '%p\n' | sort > "$RUNNER_TEMP/images-before.txt"

      - name: Run AI Agent
        env:
          Workers_AI: ${{ secrets.Workers_AI }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python main.py

      - name: Find newly generated image
        id: new_image
        shell: bash
        run: |
          find content/generated -maxdepth 1 -type f -name '*.png' -printf '%p\n' | sort > "$RUNNER_TEMP/images-after.txt"
          comm -13 "$RUNNER_TEMP/images-before.txt" "$RUNNER_TEMP/images-after.txt" > "$RUNNER_TEMP/new-images.txt"

          count=$(wc -l < "$RUNNER_TEMP/new-images.txt" | tr -d ' ')
          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one new PNG, found $count"
            cat "$RUNNER_TEMP/new-images.txt"
            exit 1
          fi

          image_path=$(cat "$RUNNER_TEMP/new-images.txt")
          echo "image_path=$image_path" >> "$GITHUB_OUTPUT"
          echo "New image detected: $image_path"

      - name: Upload newly generated photo
        uses: actions/upload-artifact@v4
        with:
          name: alicia-generated-image
          path: ${{ steps.new_image.outputs.image_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Save generated image and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/generation_history.json content/generated/*.png

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to save"
            exit 0
          fi

          git commit -m "chore: save generated Alicia photos [skip ci]"
          git push
