name: Instagram AI Agent

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Agent
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python main.py

      - name: Upload generated image
        uses: actions/upload-artifact@v4
        with:
          name: alicia-generated-image
          path: |
            content/generated/alicia_test.jpg
            content/posts/alicia_test.json
          if-no-files-found: error

      - name: Save generation history
        run: |
          if git diff --quiet -- data/generation_history.json data/caption_history.json content/posts/alicia_test.json; then
            echo "ℹ️ No history changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/generation_history.json data/caption_history.json content/posts/alicia_test.json content/generated/alicia_test.jpg
          git commit -m "chore: save generated post [skip ci]"
          git push

      - name: Publish to Instagram
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_IMAGE_URL: ${{ format('https://raw.githubusercontent.com/arturwarlord/instagram-ai-agent/{0}/content/generated/alicia_test.jpg', github.sha) }}
        run: |
          if [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_USER_ID" ]; then
            echo "ℹ️ Instagram credentials are not configured. Publishing skipped."
            exit 0
          fi
          python - <<'PY'
          python - <<'PY'
          import json
          from pathlib import Path
          from instagram.publisher import publish_post

          post = json.loads(
              Path("content/posts/alicia_test.json").read_text(encoding="utf-8")
          )

          media_id = publish_post(post)

          if media_id:
              post["instagram_media_id"] = media_id
              Path("content/posts/alicia_test.json").write_text(
                  json.dumps(post, ensure_ascii=False, indent=2),
                  encoding="utf-8",
              )

              import subprocess

              subprocess.run(
                  ["git", "config", "user.name", "github-actions[bot]"],
                  check=True,
              )
              subprocess.run(
                  ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
                  check=True,
              )
              subprocess.run(
                  ["git", "add", "content/posts/alicia_test.json"],
                  check=True,
              )
              subprocess.run(
                  ["git", "commit", "-m", "chore: save Instagram publication ID [skip ci]"],
                  check=True,
              )
              subprocess.run(["git", "push"], check=True)
          PY