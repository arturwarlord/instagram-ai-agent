name: Image Validation Tests

on:
  push:
    paths:
      - "ai/image_generator.py"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
      - ".github/workflows/select-photo.yml"
      - ".github/workflows/generate-caption.yml"
      - ".github/workflows/prepare-post.yml"
      - ".github/workflows/content-report.yml"
      - ".github/workflows/instagram-connection-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
