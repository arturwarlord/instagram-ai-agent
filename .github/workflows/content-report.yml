name: Alicia Content Status Report

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/content_report.py"
      - "tests/test_content_report.py"
      - ".github/workflows/content-report.yml"
      - "content/generated/**"
      - "content/selected/**"
      - "content/captions/**"
      - "content/queue/**"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate read-only content report
        run: python scripts/content_report.py
      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/content_status.md
          if git diff --cached --quiet; then
            echo "Content report is unchanged."
          else
            git commit -m "report: update Alicia content status"
            git push
          fi
