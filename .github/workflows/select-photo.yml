name: Select Alicia Photo

on:
  workflow_dispatch:
    inputs:
      filename:
        description: "Exact PNG filename from content/generated (for example: alicia_2026-10-18_150000.png)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image validation dependency
        run: python -m pip install "Pillow>=10.0.0"

      - name: Copy photo to curated folder
        env:
          SELECTED_FILENAME: ${{ inputs.filename }}
        run: python scripts/select_photo.py "$SELECTED_FILENAME"

      - name: Commit selected photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/selected/
          git commit -m "content: select Alicia photo"
          git push
